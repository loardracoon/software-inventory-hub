# TLS in front of the Hub gateway, on the published high port. Certificate: Mailu's Let's Encrypt
# certificate for mail.sophizo.com.br (mounted read-only from /mailu/certs/letsencrypt).
# Open connections per client address (this proxy sees the real address; request rates are limited per address
# in the gateway behind it, README › Rate limits).
limit_conn_zone $binary_remote_addr zone=tls_conn:10m;
limit_conn_status 429;

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /le/live/mailu/fullchain.pem;
  ssl_certificate_key /le/live/mailu/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # Plain HTTP sent to this port gets redirected to HTTPS on the same port.
  # ($http_host keeps the published port; $server_port would be the container's 8443.)
  error_page 497 =301 https://$http_host$request_uri;

  client_max_body_size 10m;
  limit_conn tls_conn 100;
  # Slow clients (slowloris).
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 30s;

  # Resolve kong through Docker's DNS on each request (cached 10 s): update.sh recreates kong, and an
  # address fixed at start would give 502 until this container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $kong http://kong:8000;

  location / {
    proxy_pass $kong;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
}

# mcs.sophizo.com.br through Cloudflare (proxied; an Origin Rule sends it to this port). Certificate: Cloudflare
# Origin CA for mcs.sophizo.com.br (./certs, valid until 2041), trusted only by Cloudflare: use SSL mode Full (strict).
server {
  listen 8443 ssl;
  http2 on;
  server_name mcs.sophizo.com.br;

  ssl_certificate /certs/mcs.pem;
  ssl_certificate_key /certs/mcs.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # The real client address is Cloudflare's CF-Connecting-IP, trusted only from Cloudflare's ranges
  # (https://www.cloudflare.com/ips/, read on 2026-11-03). Without this every user would share the address of a
  # Cloudflare edge in the per-address rate limits of the gateway.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  error_page 497 =301 https://$host$request_uri;
  client_max_body_size 10m;
  limit_conn tls_conn 100;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 30s;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $kong http://kong:8000;

  location / {
    proxy_pass $kong;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Only the real client address (not the X-Forwarded-For a caller sends through Cloudflare).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
}
