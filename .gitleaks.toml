# Secret scanning (gitleaks, run by CI on every push and by .githooks/pre-commit). Default rules plus a narrow allowlist
# for values that are obviously fake. Add a line here only after checking that the value is not a real secret;
# never allow a whole folder.
title = "Dictionary Hub gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Fake test values"
# Fake values in unit tests: sequences such as 0123456789 do not occur in real keys.
regexes = ['''0123456789''', '''(?i)^(wrong|bad|fake|test|mock)[-_a-z0-9]*$''']
